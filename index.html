<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #fbf6ee;
    --card: #ffffff;
    --text: #3b2f2a;
    --muted: #8a7a6f;
    --accent: #e07a3f;
    --accent-soft: #fde9d9;
    --line: #efe3d3;
    --shadow: 0 4px 14px rgba(120, 80, 40, 0.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 30px;
  }
  .top {
    padding: 22px 18px 14px;
    background: linear-gradient(135deg, #fde9d9 0%, #fbf6ee 100%);
    border-bottom: 1px solid var(--line);
  }
  .top h1 { margin: 0; font-size: 24px; font-weight: 700; }
  .top p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .wrap { padding: 14px 16px; }

  #search {
    width: 100%;
    padding: 12px 16px;
    font-size: 16px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  #back {
    display: none;
    margin-bottom: 12px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    cursor: pointer;
    transition: transform .15s, background .2s;
  }
  #back:active { transform: scale(0.96); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .section-card {
    border-radius: 18px;
    padding: 18px 12px;
    text-align: center;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .15s, box-shadow .2s, filter .2s;
    animation: pop .4s ease both;
  }
  .section-card:hover { filter: brightness(1.06); box-shadow: 0 8px 22px rgba(120, 80, 40, 0.22); }
  .section-card:active { transform: scale(0.95); }
  .section-card .icon { font-size: 34px; display: block; margin-bottom: 6px; }
  .section-card .count { font-size: 12px; font-weight: 500; opacity: .9; margin-top: 2px; }

  .dish {
    background: var(--card);
    border-radius: 16px;
    margin-top: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: pop .35s ease both;
  }
  .dish-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    font-weight: 600;
    font-size: 17px;
    cursor: pointer;
    transition: background .2s;
  }
  .dish-head:active { background: var(--accent-soft); }
  .arrow { color: var(--accent); font-size: 18px; transition: transform .25s; }
  .dish.open .arrow { transform: rotate(180deg); }
  .dish-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
    padding: 0 16px;
  }
  .dish.open .dish-body { max-height: 1200px; padding-bottom: 16px; }
  .label {
    margin-top: 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .value { margin-top: 4px; font-size: 15px; line-height: 1.45; }
  .bar-meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:14px; margin-top:5px; }
  .bar-price { color:var(--text); font-weight:700; font-size:16px; white-space:nowrap; }
  .chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: #fde2e0;
    color: #c0392b;
  }
  .chip.none { background: #e3f4e3; color: #2e7d32; }

  .empty { text-align: center; color: var(--muted); padding: 30px 0; }

  @keyframes pop {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .grid .wide { grid-column: 1 / -1; padding: 30px 12px; font-size: 20px; letter-spacing: .04em; }
  .section-card.disabled, .section-card.disabled:hover { opacity: .55; cursor: default; filter: grayscale(.4); box-shadow: var(--shadow); }
  .t-progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .t-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
  .t-q { background: var(--card); border-radius: 16px; padding: 18px 16px; font-size: 18px; font-weight: 600; line-height: 1.4; box-shadow: var(--shadow); margin-bottom: 14px; animation: pop .3s ease both; }
  .t-opt { display: block; width: 100%; text-align: left; margin-top: 10px; padding: 14px 16px; font: inherit; font-size: 16px; color: var(--text); background: var(--card); border: 2px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); cursor: pointer; transition: transform .15s, border-color .2s, background .2s; animation: pop .3s ease both; }
  .t-opt:active { transform: scale(0.98); border-color: var(--accent); }
  .t-opt.right { background: #e3f4e3; border-color: #2e7d32; color: #1f5e23; }
  .t-opt.wrong { background: #fde2e0; border-color: #c0392b; color: #a52f23; }
  .t-next { display: block; width: 100%; margin-top: 16px; padding: 14px; font: inherit; font-size: 16px; font-weight: 700; color: #fff; background: var(--accent); border: none; border-radius: 14px; cursor: pointer; transition: transform .15s; }
  .t-next:active { transform: scale(0.97); }
  .t-ghost { background: var(--accent-soft); color: var(--accent); }
  .t-result { background: var(--card); border-radius: 18px; padding: 28px 16px; text-align: center; box-shadow: var(--shadow); animation: pop .35s ease both; }
  .t-score { font-size: 44px; font-weight: 800; color: var(--accent); }
  .t-pct { margin-top: 6px; font-size: 18px; font-weight: 600; }
  .t-msg { margin-top: 10px; color: var(--muted); font-size: 15px; line-height: 1.4; }
</style>
</head>

    "Холодные закуски": { icon: "🥗", color: "#6aa84f" },
    "Горячие закуски": { icon: "🍲", color: "#e07a3f" },
    "Салаты": { icon: "🥬", color: "#58a55c" },
    "Супы": { icon: "🍜", color: "#d9822b" },
    "Основные блюда": { icon: "🍽️", color: "#b5543a" },
    "Паста": { icon: "🍝", color: "#e0a030" },
    "Пицца": { icon: "🍕", color: "#d9533b" },
    "Гарниры": { icon: "🥔", color: "#a67c52" },
    "Десерты": { icon: "🍰", color: "#d9669a" },
    "Детям": { icon: "🧸", color: "#7a6bd1" },
    "Напитки": { icon: "🍹", color: "#3d8fc4" }
  };
  const DEFAULT_STYLE = { icon: "🍴", color: "#c9803f" };
  // ========================================

  const list = document.getElementById("list");
  const search = document.getElementById("search");
  const back = document.getElementById("back");
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");

  let currentGroup = null;
  let currentCategory = null;
  let view = "home";

  function countWord(n, noun) {
    const m10 = n % 10, m100 = n % 100;
    const forms = noun === "блюдо" ? ["блюдо", "блюда", "блюд"] : ["позиция", "позиции", "позиций"];
    if (m10 === 1 && m100 !== 11) return n + " " + forms[0];
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return n + " " + forms[1];
    return n + " " + forms[2];
  }

  function makeSectionCard(icon, color, name, count, onClick, delay) {
    const card = document.createElement("div");
    card.className = "section-card";
    card.style.background = "linear-gradient(135deg, " + color + ", " + color + "cc)";
    card.style.animationDelay = (delay * 0.05) + "s";
    card.innerHTML = '<span class="icon"></span><div class="nm"></div><div class="count"></div>';
    card.querySelector(".icon").textContent = icon;
    card.querySelector(".nm").textContent = name;
    card.querySelector(".count").textContent = count;
    card.onclick = onClick;
    return card;
  }

  function showSections() {
    view = "home";
    currentGroup = null;
    currentCategory = null;
    title.textContent = "Меню ресторана";
    subtitle.textContent = "Выбери нужный раздел";
    back.style.display = "none";
    search.style.display = "block";
    search.value = "";
    list.innerHTML = "";
    const grid = document.createElement("div");
    grid.className = "grid";
    const card = makeSectionCard("🍴", "#e07a3f", "МЕНЮ", "Кухня · Бар · Тестирование", showMenuRoot, 0);
    grid.appendChild(card);
    const service = makeSectionCard("🤝", "#56866b", "Правила сервиса", "Основы обслуживания гостей", showServiceRules, 1);
    grid.appendChild(service);
    list.appendChild(grid);
  }

  function showMenuRoot() {
    view = "root";
    currentGroup = null;
    currentCategory = null;
    title.textContent = "🍴 Меню";
    subtitle.textContent = "Выбери раздел";
    back.style.display = "inline-block";
    back.textContent = "← Назад";
    search.style.display = "none";
    list.innerHTML = "";
    const grid = document.createElement("div");
    grid.className = "grid";
    grid.appendChild(makeSectionCard("🍽️", "#b5543a", "Кухня", countWord(Object.values(MENU).reduce((n, section) => n + Object.keys(section).length, 0), "блюдо"), function () { showCategories("kitchen"); }, 0));
    grid.appendChild(makeSectionCard("🍸", "#3d8fc4", "Бар", countWord(Object.values(BAR_MENU).reduce((n, items) => n + items.length, 0), "позиция"), function () { showCategories("bar"); }, 1));
    const t = makeSectionCard("📝", "#7a6bd1", "Тестирование", "Проверь свои знания", showTesting, 2);
    t.classList.add("wide");
    grid.appendChild(t);
    list.appendChild(grid);
    window.scrollTo(0, 0);
  }


  // ============ СТАНДАРТЫ СЕРВИСА ============
  const SERVICE_RULES = [

      tip: "Не пересказывай всё меню подряд. Сначала выясни, нужна ли гостю помощь с выбором."

    {
      title: "3. Выявление предпочтений",
      text: "Задавай уместные открытые вопросы: «Предпочитаете что-нибудь полегче или посытнее?», «Есть продукты, которые вы не едите?», «Хотите сначала напитки или уже готовы выбрать блюда?». Внимательно выслушай ответ.",
      tip: "Уточняй ограничения по питанию и аллергии до рекомендации. Не обещай отсутствие аллергена, пока не проверил информацию у ответственного сотрудника."

      title: "8. Контроль стола во время обслуживания",
      text: "Наблюдай за столом ненавязчиво: проверяй, всё ли в порядке, вовремя убирай пустую посуду с разрешения или по стандарту заведения, следи за напитками и дополнительными просьбами. Не прерывай беседу без необходимости.",
      tip: "Лучше заметить потребность заранее, чем ждать, пока гость будет вынужден искать официанта взглядом."

    {
      title: "9. Общение и решение проблем",
      text: "Сохраняй спокойствие, выслушай гостя до конца и не спорь. Признай неудобство, уточни, как можно исправить ситуацию, и оперативно подключи менеджера, если вопрос выходит за пределы твоих полномочий.",
      tip: "Не обвиняй коллег и кухню при госте. Не обещай того, что не можешь гарантировать."
    },
    {
      title: "10. Завершение обслуживания",
      text: "Уточни, всё ли понравилось, предложи подходящий десерт или горячий напиток, если это уместно. При расчёте действуй внимательно и конфиденциально. Поблагодари гостя и попрощайся доброжелательно.",
      tip: "Даже короткое искреннее «Спасибо, будем рады видеть вас снова» помогает завершить визит на хорошей ноте."

  function makeRuleCard(rule, delay) {
    const card = document.createElement("div");
    card.className = "dish";
    card.style.animationDelay = (delay * 0.04) + "s";
    const head = document.createElement("div");
    head.className = "dish-head";
    const name = document.createElement("span");
    name.textContent = rule.title;
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "⌄";
    head.appendChild(name);
    head.appendChild(arrow);

    const body = document.createElement("div");
    body.className = "dish-body";
    const description = document.createElement("div");
    description.className = "value";
    description.textContent = rule.text;
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "Мини-подсказка";
    const tip = document.createElement("div");
    tip.className = "value";
    tip.textContent = rule.tip;
    body.appendChild(description);
    body.appendChild(label);
    body.appendChild(tip);
    card.appendChild(head);
    card.appendChild(body);
    head.onclick = function () { card.classList.toggle("open"); };
    return card;
  }

  function showServiceRules() {
    view = "service";
    currentGroup = null;
    currentCategory = null;
    title.textContent = "🤝 Правила сервиса";
    subtitle.textContent = "Основы обслуживания гостей";
    back.style.display = "inline-block";
    back.textContent = "← На главную";
    search.style.display = "none";
    list.innerHTML = "";
    const intro = document.createElement("div");
    intro.className = "value";
    intro.style.margin = "4px 2px 12px";
    intro.textContent = "Общие ориентиры для работы официанта. Внутренние правила и порядок работы вашего заведения можно будет добавить и скорректировать отдельно.";
    list.appendChild(intro);
    SERVICE_RULES.forEach(function (rule, i) {
      list.appendChild(makeRuleCard(rule, i));
    });
    window.scrollTo(0, 0);
  }

  function showCategories(group) {
    currentGroup = group;
    currentCategory = null;
    const data = group === "bar" ? BAR_MENU : MENU;
    title.textContent = group === "bar" ? "🍸 Бар" : "🍽️ Кухня";
    subtitle.textContent = "Выбери категорию";
    back.style.display = "inline-block";
    back.textContent = "← Назад к меню";
    search.style.display = "none";
    list.innerHTML = "";
    const grid = document.createElement("div");
    grid.className = "grid";
    Object.keys(data).forEach(function (category, i) {
      const st = STYLES[category] || (group === "bar" ? { icon: "🍷", color: "#8b5a75" } : DEFAULT_STYLE);
      const count = group === "bar" ? data[category].length : Object.keys(data[category]).length;
      grid.appendChild(makeSectionCard(st.icon, st.color, category, countWord(count, group === "bar" ? "позиция" : "блюдо"), function () { showDishes(category); }, i));
    });
    list.appendChild(grid);
    window.scrollTo(0, 0);
  }

  function allergenChips(text) {
    const wrap = document.createElement("div");
    wrap.className = "chips";
    const parts = text.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!parts.length) {
      const c = document.createElement("span");
      c.className = "chip none";
      c.textContent = "Нет";
      wrap.appendChild(c);
      return wrap;
    }
    parts.forEach(function (p) {
      const c = document.createElement("span");
      c.className = "chip";
      c.textContent = "⚠ " + p;
      wrap.appendChild(c);
    });
    return wrap;
  }

  function dishCard(name, info, delay) {
    const div = document.createElement("div");
    div.className = "dish";
    div.style.animationDelay = (delay || 0) + "s";
    div.innerHTML =
      '<div class="dish-head"><span class="nm"></span><span class="arrow">▾</span></div>' +
      '<div class="dish-body">' +
      '<div class="label">📋 Состав</div><div class="value c"></div>' +
      '<div class="label">🥫 Соусы</div><div class="value s"></div>' +
      '<div class="label">Аллергены</div><div class="al"></div>' +
      '</div>';
    div.querySelector(".nm").textContent = name;
    div.querySelector(".c").textContent = info.composition;
    div.querySelector(".s").textContent = info.sauces;
    div.querySelector(".al").appendChild(allergenChips(info.allergens || ""));
    div.querySelector(".dish-head").onclick = function () { div.classList.toggle("open"); };
    return div;
  }

  function barCard(item, delay) {
    const div = document.createElement("div");
    div.className = "dish";
    div.style.animationDelay = (delay || 0) + "s";
    const head = document.createElement("div");
    head.className = "dish-head";
    const name = document.createElement("span");
    name.className = "nm";
    name.textContent = item.name;
    const price = document.createElement("span");
    price.className = "bar-price";
    price.textContent = item.price || "";
    head.appendChild(name);
    head.appendChild(price);
    const meta = document.createElement("div");
    meta.className = "bar-meta";
    meta.style.padding = "0 16px 15px";
    meta.textContent = item.volume || "";
    div.appendChild(head);
    div.appendChild(meta);
    const description = document.createElement("div");
    description.className = "bar-description";
    description.style.cssText = "display:none;padding:0 16px 15px;color:var(--muted);font-size:13px;line-height:1.45";
    description.textContent = item.description || BAR_DESCRIPTIONS[item.name] || "Краткое описание этого напитка уточняется по спецификации производителя.";
    div.appendChild(description);
    head.style.cursor = "pointer";
    head.onclick = function () {
      const opened = description.style.display !== "none";
      description.style.display = opened ? "none" : "block";
      div.classList.toggle("open", !opened);
    };
    return div;
  }

  function showDishes(section) {
    currentCategory = section;
    const isBar = currentGroup === "bar";
    const st = STYLES[section] || (isBar ? { icon: "🍷" } : DEFAULT_STYLE);
    title.textContent = st.icon + " " + section;
    subtitle.textContent = isBar ? "Нажми на напиток, чтобы увидеть описание" : "Нажми на блюдо, чтобы увидеть состав";
    back.style.display = "inline-block";
    back.textContent = "← Назад к категориям";
    search.style.display = "none";
    list.innerHTML = "";
    if (isBar) {
      BAR_MENU[section].forEach(function (item, i) { list.appendChild(barCard(item, i * 0.04)); });
    } else {
      Object.keys(MENU[section]).forEach(function (name, i) {
        list.appendChild(dishCard(name, MENU[section][name], i * 0.05));
      });
    }
    window.scrollTo(0, 0);
  }

  // ============ ТЕСТИРОВАНИЕ ============
  const TEST_LENGTH = 10;
  let test = null;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function showTesting() {
    view = "testing";
    currentGroup = null;
    currentCategory = null;
    title.textContent = "📝 Тестирование";
    subtitle.textContent = "Выбери тест";
    back.style.display = "inline-block";
    back.textContent = "← Назад";
    search.style.display = "none";
    list.innerHTML = "";
    const grid = document.createElement("div");
    grid.className = "grid";
    grid.appendChild(makeSectionCard("🍽️", "#b5543a", "Тест кухни", TEST_LENGTH + " случайных вопросов", startKitchenTest, 0));
    const bar = makeSectionCard("🍸", "#3d8fc4", "Тест бара", "Скоро", null, 1);
    bar.classList.add("disabled");
    grid.appendChild(bar);
    list.appendChild(grid);
    window.scrollTo(0, 0);
  }

  function startKitchenTest() {
    const picked = shuffle(KITCHEN_TEST.slice()).slice(0, TEST_LENGTH);
    test = {
      idx: 0, score: 0, answered: false,
      items: picked.map(function (q) {
        return { q: q.q, correct: q.options[q.answer], options: shuffle(q.options.slice()) };
      })
    };
    renderQuestion();
  }

  function makeButton(cls, text, onClick) {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = text;
    b.onclick = onClick;
    return b;
  }

  function renderQuestion() {
    view = "test";
    const item = test.items[test.idx];
    const total = test.items.length;
    title.textContent = "📝 Тест кухни";
    subtitle.textContent = "Вопрос " + (test.idx + 1) + " из " + total;
    back.style.display = "inline-block";
    back.textContent = "← К тестам";
    search.style.display = "none";
    list.innerHTML = "";
    const prog = document.createElement("div");
    prog.className = "t-progress";
    const bar = document.createElement("div");
    bar.className = "t-bar";
    bar.style.width = (test.idx / total * 100) + "%";
    prog.appendChild(bar);
    list.appendChild(prog);
    const q = document.createElement("div");
    q.className = "t-q";
    q.textContent = item.q;
    list.appendChild(q);
    const next = makeButton("t-next", test.idx === total - 1 ? "Показать результат" : "Далее →", function () {
      test.idx++;
      test.answered = false;
      if (test.idx >= total) showTestResult(); else renderQuestion();
    });
    next.style.display = "none";
    const btns = [];
    item.options.forEach(function (text) {
      const b = makeButton("t-opt", text, function () {
        if (test.answered) return;
        test.answered = true;
        if (text === item.correct) test.score++;
        btns.forEach(function (x) {
          if (x.textContent === item.correct) x.classList.add("right");
          else if (x === b) x.classList.add("wrong");
        });
        bar.style.width = ((test.idx + 1) / total * 100) + "%";
        next.style.display = "block";
      });
      btns.push(b);
      list.appendChild(b);
    });
    list.appendChild(next);
    window.scrollTo(0, 0);
  }

  function showTestResult() {
    view = "test";
    const total = test.items.length;
    const pct = Math.round(test.score / total * 100);
    title.textContent = "🏁 Результат";
    subtitle.textContent = "Тест кухни завершён";
    list.innerHTML = "";
    const box = document.createElement("div");
    box.className = "t-result";
    const big = document.createElement("div");
    big.className = "t-score";
    big.textContent = test.score + " из " + total;
    const p = document.createElement("div");
    p.className = "t-pct";
    p.textContent = pct + "% правильных ответов";
    const msg = document.createElement("div");
    msg.className = "t-msg";
    msg.textContent = pct >= 90 ? "Отлично! Меню знаешь как профи." : pct >= 70 ? "Хороший результат, осталось чуть-чуть." : pct >= 50 ? "Неплохо, но стоит повторить меню." : "Стоит ещё раз изучить меню и попробовать снова.";
    box.appendChild(big); box.appendChild(p); box.appendChild(msg);
    list.appendChild(box);
    list.appendChild(makeButton("t-next", "🔁 Пройти ещё раз", startKitchenTest));
    list.appendChild(makeButton("t-next t-ghost", "К тестам", showTesting));
    window.scrollTo(0, 0);
  }

  search.addEventListener("input", function () {
    const q = search.value.trim().toLowerCase();
    if (!q) { showSections(); return; }
    list.innerHTML = "";
    let found = 0;
    Object.keys(MENU).forEach(function (section) {
      Object.keys(MENU[section]).forEach(function (name) {
        if (name.toLowerCase().indexOf(q) !== -1) {
          list.appendChild(dishCard(name, MENU[section][name], found * 0.04));
          found++;
        }
      });
    });
    Object.keys(BAR_MENU).forEach(function (section) {
      BAR_MENU[section].forEach(function (item) {
        if (item.name.toLowerCase().indexOf(q) !== -1 || section.toLowerCase().indexOf(q) !== -1) {
          list.appendChild(barCard(item, found * 0.04));
          found++;
        }
      });
    });
    if (!found) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Ничего не найдено";
      list.appendChild(e);
    }
  });

  back.onclick = function () {
    if (view === "service") showSections();
    else if (view === "test") showTesting();
    else if (view === "testing") showMenuRoot();
    else if (currentCategory !== null) showCategories(currentGroup);
    else if (currentGroup !== null) showMenuRoot();
    else showSections();
  };
  showSections();
</script>
</body>
</html>
